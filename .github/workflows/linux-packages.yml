name: Linux Packages

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-linux-packages:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (build only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick squashfs-tools file

      - name: Build .deb package
        shell: bash
        run: ./build/linux/build-deb.sh

      - name: Build AppImage package
        shell: bash
        run: ./build/linux/build-appimage.sh

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/linux/output/*.deb
            build/linux/output/*.AppImage
          if-no-files-found: error

      - name: Attach packages to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            build/linux/output/mirto-launcher_*_amd64.deb \
            build/linux/output/Mirto-Launcher-*-x86_64.AppImage \
            --clobber
