name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests (JaCoCo agent + report bound to the test phase)
        run: mvn -B test

      - name: Static analysis (SpotBugs, High threshold)
        run: mvn -B spotbugs:check

      - name: Package (windows-release profile)
        run: mvn -B -Pwindows-release -DskipTests package

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
